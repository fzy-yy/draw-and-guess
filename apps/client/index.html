<!doctype html>
<!-- 客户端 HTML 入口：Vue 将应用挂载到 #app；本项目主要适配电脑网页端浏览器 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 站点图标：SVG 矢量图标（public/favicon.svg，Vite 原样拷贝到站点根），消除默认 /favicon.ico 的 404 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 页面标题与描述由 vite.config.ts 从 @draw-guess/strings 注入，index.html 不硬编码文案 -->
    <meta name="description" content="" />
    <title></title>
  </head>
  <body>
    <!-- Vue 应用挂载点：全部界面都由 src/main.ts 动态渲染 -->
    <div id="app"></div>
    <!-- ES 模块入口脚本：由 Vite 打包并注入 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
