name: windows-release

# 打 v* tag 时构建 Windows 分发产物（可运行目录 + zip）并发布 GitHub Release；
# 手动触发（workflow_dispatch）只产出 artifact，便于验证打包链路。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Build Windows dist zip
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate and build
        run: pnpm build
      - name: Build distributable package
        # runner 在境外：内置 Node 显式走官方源，避免默认国内镜像不稳定拖满超时。
        env:
          NODE_DIST_MIRROR: https://nodejs.org/dist/
        run: pnpm package:dist
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem release/*.zip | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets --title "${{ github.ref_name }}" --generate-notes
      - name: Upload artifact for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draw-and-guess-windows-dist
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
