name: cleanup-artifacts

# artifact 存储配额有限：定期删除超过保留窗口的旧工件，避免 quality.yml 的上传步骤因配额耗尽而失败。
# 上传步骤本身已加 continue-on-error 兜底（配额问题不应误伤质量门禁），这里做根治性清理。
on:
  schedule:
    # 每天 03:17 UTC（错开整点以减少排队）。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete expired artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete artifacts older than retention window
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: '7'
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting artifacts created before ${cutoff} in ${repo}"
          total=0
          # 每轮删完过期工件再重新取列表，直到没有剩余；最多 100 轮防止异常死循环。
          for _ in $(seq 1 100); do
            ids="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${repo}/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | .id")"
            if [ -z "${ids}" ]; then
              break
            fi
            for id in ${ids}; do
              gh api -X DELETE "/repos/${repo}/actions/artifacts/${id}" >/dev/null
              total=$((total + 1))
            done
          done
          echo "Deleted ${total} artifact(s) older than ${cutoff}"
