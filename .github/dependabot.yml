version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      # major 不命中此分组，Dependabot 会为每个重大升级单独创建 PR。
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      # Action 的 major 同样保持单独 PR，便于逐项审查权限与运行时变更。
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
